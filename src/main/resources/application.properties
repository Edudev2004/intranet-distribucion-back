spring.application.name=intranet-distribucion-back
spring.main.allow-bean-definition-overriding=true
spring.config.import=optional:file:.env[.properties]

# Puerto del Servidor
server.port=8080

# Configuración JDBC ensamblada desde variables de entorno
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}?sslmode=require
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración JDBC para tu PostgreSQL local
#spring.datasource.url=jdbc:postgresql://localhost:5432/db_intranet_backus?sslmode=disable
#spring.datasource.username=postgres
#spring.datasource.password=proyar
#spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate (Generación automática de tablas en PostgreSQL)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Configuración JWT (Secret con fallback para desarrollo local)
app.jwt.secret=${JWT_SECRET:9a4f2c8d7e1b5a3f6c8d0e2b4a6f8c1d3e5b7a9f0c2d4e6b8a0f2c4d6e8b0a2f}
app.jwt.expiration-milliseconds=${JWT_EXPIRATION:86400000}
