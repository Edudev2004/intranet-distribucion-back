spring.application.name=intranet-distribucion-back

# Puerto del Servidor
server.port=8080

# Configuración de Base de Datos PostgreSQL (Supabase)
# Reemplaza con las credenciales reales de tu proyecto en Supabase
spring.datasource.url=jdbc:postgresql://aws-0-sa-east-1.pooler.supabase.com:5432/postgres?sslmode=require
spring.datasource.username=postgres.tu-proyecto-id
spring.datasource.password=tu-contrasena-supabase
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
